[bootstrap.hooks]
pre-dotfiles = '''
set -e
[ -d "$HOME/.local/share/chezmoi/.git" ] || { echo "dotfiles missing at ~/.local/share/chezmoi, run kickstart.sh first" >&2; exit 1; }
'''
post-dotfiles = '''
set -e
{% if os() == "macos" %}export PATH="/opt/homebrew/bin:$PATH"{% endif %}
tpm_dir="$HOME/.config/tmux/plugins/tpm"
if [ ! -f "$tpm_dir/tpm" ]; then
  rm -rf "$tpm_dir"
  git clone --depth 1 https://github.com/tmux-plugins/tpm "$tpm_dir"
fi
"$tpm_dir/bin/install_plugins"
'''
post-tools = '''
set -e
{% if os() == "macos" %}export PATH="/opt/homebrew/bin:$PATH"{% endif %}
[ -d "$HOME/.local/share/nvim/lazy/lazy.nvim" ] || mise exec -- bash "$HOME/.config/zsh/bootstrap-plugins.sh" --nvim
{% if os() == "macos" %}brew list --cask aerospace >/dev/null 2>&1 || brew install --cask nikitabobko/tap/aerospace{% endif %}
mise exec -- npm ls -g @openai/codex >/dev/null 2>&1 || mise exec -- npm install -g @openai/codex
mise run zsh-completions-update || echo "zsh completions: some tools failed, rerun mise run zsh-completions-update" >&2
'''

[tasks.bootstrap]
description = "Login shell and git signing setup"
run = '''
set -e
if [ "$(basename "${SHELL:-}")" != "zsh" ]; then
  zsh_path="$(command -v zsh)"
  grep -qx "$zsh_path" /etc/shells || echo "$zsh_path" | sudo tee -a /etc/shells >/dev/null
  chsh -s "$zsh_path"
fi

allowed_signers="$HOME/.config/git/allowed_signers"
signing_email="$(git config --global --includes user.email || true)"
signing_key="$(cat "$HOME/.ssh/id_ed25519.pub" 2>/dev/null | awk '{print $1" "$2}')"
if [ -n "$signing_email" ] && [ -n "$signing_key" ] && ! grep -qF "$signing_key" "$allowed_signers" 2>/dev/null; then
  echo "$signing_email $signing_key" >> "$allowed_signers"
fi
'''

[tasks.publish-kickstart]
description = "Publish ~/kickstart.sh to GitHub Pages"
quiet = true
run = '''
set -e
pages_repo="${GHQ_ROOT:-$HOME/Projects}/github.com/AnudeepChPaul/AnudeepChPaul.github.io"
[ -d "$pages_repo/.git" ] || git clone git@github.com:AnudeepChPaul/AnudeepChPaul.github.io.git "$pages_repo"
git -C "$pages_repo" pull --ff-only --quiet || true
cp "$HOME/kickstart.sh" "$pages_repo/kickstart.sh"
touch "$pages_repo/.nojekyll"
git -C "$pages_repo" add kickstart.sh .nojekyll
if git -C "$pages_repo" diff --cached --quiet; then
  echo "kickstart.sh already published"
else
  git -C "$pages_repo" commit --quiet -m "Update kickstart script"
  git -C "$pages_repo" push --quiet origin HEAD:main
  echo "published https://anudeepchpaul.github.io/kickstart.sh"
fi
'''
