digest_root: ~/digest
git_repository_roots:
  - ~/Projects/code.hq.twilio.com/flex/flex-admin-api/
  - ~/Projects/github.com/twilio/twilio-webchat-react-app/
  - ~/Projects/github.com/twilio-internal/flex-admin-console-e2e-tests/
  - ~/Projects/github.com/twilio-internal/flex-admin-api-deploy/
  - ~/Projects/github.com/twilio-internal/console/
  - ~/Projects/github.com/twilio-internal/one-console/
  - ~/Projects/github.com/twilio-internal/otk-mesh-config/
git_lookback_days: 3
pr_quantity_per_repo: 20
show_daily_commits: true
git_commits_cmd: 'git log -n 50 --author="$(git config user.email)" --since="{since}" --until="{until}" --pretty="format:%h|%s"'
git_auto_sync_interval: 3600s
review_command: 'claude -p "/review-toolkit:review {url} --emit findings-json --emit-to {findings}" --permission-mode auto'
green_only: true
jira_base_url: ""

janitor_patterns:
  - java_error_in_*.log
  - hs_err_pid*.log
  - jbr_err_pid*.log
  - "*.hprof"
  - java[0-9].log
  - "*.pre-dump.bak"
  - GlobalProtectLogs*.tgz
jobs:
  - name: branch reaper
    dry-run-command: "digest branch-reaper --dry-run --root ~/Projects/"
    command: "digest branch-reaper --root ~/Projects/"
  - name: janitor
    dry-run-command: "digest janitor --dry-run --root ~ --root ~/Projects/ --root ~/digest/reviews/"
    command: "digest janitor --root ~ --root ~/Projects/"
  - name: repo sync
    dry-run-command: "digest repo-sync --dry-run --root ~/Projects/"
    command: "digest repo-sync --root ~/Projects/"

brag_prompts:
  - Below are facts about my work for one ISO week. They are the only source of truth; never invent work, metrics or people.
  - If required, you can always refer to PR description for more knowledge.
  - Write a concise, strong impact-focused brag summary as grouped bullet points under a '## Summary' heading. Do not repeat the facts verbatim. Output only markdown.
month_brag_prompts:
  - Below are my weekly brags (summaries and facts) for one month. They are the only source of truth; never invent work, metrics or people.
  - Write a concise monthly brag under a '## Summary' heading, with 3-6 themed groups of bullets covering outcomes, my role and evidence (repos, PRs, dates). Output only markdown.
performance_review_prompts:
  - You are helping a Twilio L4 software engineer write their annual performance self-review.
  - Never ever use the word "brag" anywhere.
  - Below are monthly brag summaries for one year. Treat them as the only source of truth; never invent work, metrics or people.
  - |
    Write markdown with these sections:
    ## Summary — 3-4 sentences on overall impact this year.
    ## Key accomplishments (the what) — 4-6 items, each: outcome, my role, scope, measurable impact, evidence (PRs/repos/dates from the input).
    ## How I worked (the how) — behaviours with examples: ownership, customer focus, collaboration/code review, quality & operational excellence, written communication.
    ## Technical depth & craft — notable design, reliability, tooling or migration work.
    ## Helping others — reviews, unblocking, mentoring.
    ## Growth areas — 2-3 honest areas with a concrete plan.
    ## Goals for next year — 3 goals tied to the above.
  - Use first person, past tense, concise bullets. Output only markdown.
